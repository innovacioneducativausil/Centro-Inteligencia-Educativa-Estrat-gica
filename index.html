<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIEE</title>

    <!-- Google Fonts: Inter + Space Grotesk + Bricolage Grotesque -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* ─── Global Font ─── */
      *, *::before, *::after {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      /* ─── Global Scrollbar ─── */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(42, 157, 143, 0.28); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(42, 157, 143, 0.55); }

      /* ─── Keyframe Animations ─── */
      @keyframes kf-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes kf-slide-up {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes kf-slide-down {
        from { opacity: 0; transform: translateY(-10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes kf-slide-from-right {
        from { opacity: 0; transform: translateX(22px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes kf-slide-from-left {
        from { opacity: 0; transform: translateX(-22px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes kf-zoom-in {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes kf-pulse-dot {
        0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
        65%       { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
      }
      @keyframes kf-float {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-7px); }
      }
      @keyframes kf-spin-slow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes kf-shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }

      /* ─── animate-in system ─── */
      .animate-in {
        animation-fill-mode: both;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        animation-duration: 0.45s; /* safe default */
      }
      .animate-in.duration-200 { animation-duration: 0.2s; }
      .animate-in.duration-300 { animation-duration: 0.3s; }
      .animate-in.duration-500 { animation-duration: 0.5s; }
      .animate-in.duration-700 { animation-duration: 0.7s; }

      .fade-in              { animation-name: kf-fade-in; }
      .slide-in-from-top-2  { animation-name: kf-slide-down; }
      .slide-in-from-bottom-6,
      .slide-in-from-bottom-10 { animation-name: kf-slide-up; }
      .slide-in-from-right-6,
      .slide-in-from-right-10  { animation-name: kf-slide-from-right; }
      .slide-in-from-left-6    { animation-name: kf-slide-from-left; }
      .zoom-in-95              { animation-name: kf-zoom-in; }

      /* ─── Utility Animations ─── */
      .animate-pulse-dot  { animation: kf-pulse-dot  2s ease-out     infinite; }
      .animate-float      { animation: kf-float      4s ease-in-out  infinite; }
      .animate-spin-slow  { animation: kf-spin-slow  12s linear      infinite; }

      /* ─── Custom Utilities ─── */
      .shadow-3xl { box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.22); }

      .text-gradient-teal {
        background: linear-gradient(135deg, #2A9D8F, #38BDF8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ─── Radar Login Animations ─── */
      @keyframes pulse-ring {
        0%   { transform: translate(-50%, -50%) scale(1);    opacity: 0.2; }
        50%  { transform: translate(-50%, -50%) scale(1.02); opacity: 0.4; }
        100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.2; }
      }
      @keyframes rotate-sweep {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .radar-ring {
        border: 1px solid rgba(17, 82, 212, 0.2);
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: pulse-ring 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .radar-sweep {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 50%;
        height: 2px;
        background: linear-gradient(90deg, rgba(17, 82, 212, 0.8), transparent);
        transform-origin: left center;
        animation: rotate-sweep 8s linear infinite;
      }
      .data-point {
        position: absolute;
        width: 6px;
        height: 6px;
        background-color: #1152d4;
        border-radius: 50%;
        box-shadow: 0 0 10px #1152d4;
      }
      .font-display {
        font-family: 'Space Grotesk', sans-serif;
      }

      /* ─── Password Strength Meter ─── */
      .strength-segment {
        height: 4px;
        border-radius: 2px;
        background-color: #e2e8f0;
        flex: 1;
        transition: background-color 0.3s ease;
      }
      .strength-segment.active-weak   { background-color: #ef4444; }
      .strength-segment.active-medium { background-color: #f59e0b; }
      .strength-segment.active-strong { background-color: #22c55e; }

      /* ─── Rich Text Editor placeholder ─── */
      [contenteditable][data-placeholder]:empty::before {
        content: attr(data-placeholder);
        color: #9ca3af;
        pointer-events: none;
      }

      /* ─── Custom Scrollbar Class ─── */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(42, 157, 143, 0.25);
        border-radius: 2px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(42, 157, 143, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
