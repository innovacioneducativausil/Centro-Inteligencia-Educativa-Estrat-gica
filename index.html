<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIEE</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>


    <script src="https://cdn.tailwindcss.com" defer></script>

    <style>
      :root {
        --ciee-primary: #00195A;
        --ciee-active: #0036DC;
        --ciee-button: #57C4DD;
        --ciee-accent: #E71E5E;
        --ciee-turquoise: #0891B2;
        --ciee-orange: #EA580C;
        --ciee-green: #24A148;
        --ciee-purple: #9B51E0;
        --ciee-success: #16A34A;
        --ciee-success-light: #DCFCE7;
        --ciee-error: #DC2626;
        --ciee-error-light: #FEE2E2;
        --ciee-warning: #F59E0B;
        --ciee-warning-light: #FFF7E6;
        --ciee-info: #0284C7;
        --ciee-info-light: #E0F2FE;
        --ciee-border: #EEEEEE;
        --ciee-border-strong: #DBDBDB;
        --ciee-surface: #F9F9F9;
        --ciee-surface-2: #F4F4F4;
        --ciee-surface-3: #EDEDED;
        --ciee-title: #2E2E2E;
        --ciee-body: #888888;
        --ciee-label: #B9B9B9;
        --ciee-font: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

        font-family: var(--ciee-font);
      }

      body {
        margin: 0;
        background: var(--ciee-surface);
        color: var(--ciee-title);
      }


      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(87, 196, 221, 0.42); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0, 54, 220, 0.55); }


      @keyframes kf-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes kf-slide-up {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes kf-slide-down {
        from { opacity: 0; transform: translateY(-10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes kf-slide-from-right {
        from { opacity: 0; transform: translateX(22px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes kf-slide-from-left {
        from { opacity: 0; transform: translateX(-22px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes kf-zoom-in {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes kf-pulse-dot {
        0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
        65%       { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
      }
      @keyframes kf-float {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-7px); }
      }
      @keyframes kf-spin-slow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes kf-shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }


      .animate-in {
        animation-fill-mode: both;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        animation-duration: 0.45s;
      }
      .animate-in.duration-200 { animation-duration: 0.2s; }
      .animate-in.duration-300 { animation-duration: 0.3s; }
      .animate-in.duration-500 { animation-duration: 0.5s; }
      .animate-in.duration-700 { animation-duration: 0.7s; }

      .fade-in              { animation-name: kf-fade-in; }
      .slide-in-from-top-2  { animation-name: kf-slide-down; }
      .slide-in-from-bottom-6,
      .slide-in-from-bottom-10 { animation-name: kf-slide-up; }
      .slide-in-from-right-6,
      .slide-in-from-right-10  { animation-name: kf-slide-from-right; }
      .slide-in-from-left-6    { animation-name: kf-slide-from-left; }
      .zoom-in-95              { animation-name: kf-zoom-in; }


      .animate-pulse-dot  { animation: kf-pulse-dot  2s ease-out     infinite; }
      .animate-float      { animation: kf-float      4s ease-in-out  infinite; }
      .animate-spin-slow  { animation: kf-spin-slow  12s linear      infinite; }


      .shadow-3xl { box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.22); }

      .text-gradient-teal {
        background: linear-gradient(135deg, var(--ciee-active), var(--ciee-button));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }


      @keyframes pulse-ring {
        0%   { transform: translate(-50%, -50%) scale(1);    opacity: 0.2; }
        50%  { transform: translate(-50%, -50%) scale(1.02); opacity: 0.4; }
        100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.2; }
      }
      @keyframes rotate-sweep {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .radar-ring {
        border: 1px solid rgba(17, 82, 212, 0.2);
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: pulse-ring 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .radar-sweep {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 50%;
        height: 2px;
        background: linear-gradient(90deg, rgba(0, 54, 220, 0.8), transparent);
        transform-origin: left center;
        animation: rotate-sweep 8s linear infinite;
      }
      .data-point {
        position: absolute;
        width: 6px;
        height: 6px;
        background-color: var(--ciee-active);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--ciee-active);
      }
      .font-display {
        font-family: var(--ciee-font);
      }


      .strength-segment {
        height: 4px;
        border-radius: 2px;
        background-color: var(--ciee-surface-3);
        flex: 1;
        transition: background-color 0.3s ease;
      }
      .strength-segment.active-weak   { background-color: var(--ciee-error); }
      .strength-segment.active-medium { background-color: var(--ciee-warning); }
      .strength-segment.active-strong { background-color: var(--ciee-success); }


      [contenteditable][data-placeholder]:empty::before {
        content: attr(data-placeholder);
        color: var(--ciee-label);
        pointer-events: none;
      }


      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(87, 196, 221, 0.42);
        border-radius: 2px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 54, 220, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
